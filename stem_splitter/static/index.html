<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stem Splitter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"></span>Stem Splitter</div>
    <div class="top-right">
      <div class="device" id="device">…</div>
      <button class="icon-btn sound" id="sound" type="button" title="Suoni della scimmietta"></button>
      <button class="btn quit" id="quit" type="button" hidden>Chiudi l'app</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Separa voce e strumenti da qualsiasi brano</h1>
      <p>Tutto avviene sul tuo computer: nessun upload su server esterni.</p>
    </section>

    <section class="card">
      <h2>1. Cosa vuoi estrarre?</h2>
      <div class="chips" id="stems" role="radiogroup"></div>

      <div class="options">
        <label>Profondità di calcolo
          <select id="quality"></select>
        </label>
        <label>Formato
          <select id="format"></select>
        </label>
        <label>Frequenza di campionamento
          <select id="samplerate"></select>
        </label>
        <label>Profondità in bit
          <select id="bitdepth"></select>
        </label>
        <label>Mid/Side
          <select id="midside"></select>
        </label>
      </div>
      <p class="hint muted" id="hint"></p>

      <h2>2. Carica il brano</h2>
      <label class="drop scene" id="drop">
        <input type="file" id="file" multiple hidden>
        <div class="monkey" id="monkey">
          <div class="mk-bubble" aria-live="polite"></div>
        </div>
        <span class="muted">Trascina il brano sulla scimmietta, oppure clicca per sceglierlo · MP3, MP4, WAV, AAC, M4A, FLAC, AIFF, OGG, OPUS, WMA, MOV… (anche più file insieme)</span>
      </label>
    </section>

    <section id="jobs"></section>
  </main>

  <template id="job-tpl">
    <article class="card job">
      <div class="job-head">
        <div>
          <div class="job-title"></div>
          <div class="job-sub muted"></div>
        </div>
        <button class="icon-btn remove" title="Rimuovi">✕</button>
      </div>
      <div class="progress"><div class="bar"></div></div>
      <div class="status muted"></div>
      <div class="player" hidden>
        <div class="transport">
          <button class="play" aria-label="Riproduci">▶</button>
          <span class="time">0:00 / 0:00</span>
          <a class="btn zip" download>Scarica tutto (.zip)</a>
        </div>
        <div class="tracks"></div>
      </div>
    </article>
  </template>

  <script src="monkey.js"></script>
  <script src="app.js"></script>
</body>
</html>
